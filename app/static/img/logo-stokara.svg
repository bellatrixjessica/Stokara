<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Logo Stokara">
  <!-- Stokara: tiga kardus tersusun seperti di rak gudang -->
  <rect width="64" height="64" rx="14" fill="#3C3489"/>
  <!-- kardus atas -->
  <rect x="23" y="13" width="18" height="17" rx="2.5" fill="#EEEDFE"/>
  <path d="M29 13v6h6v-6" fill="#CECBF6"/>
  <!-- kardus kiri bawah -->
  <rect x="12" y="33" width="18" height="17" rx="2.5" fill="#AFA9EC"/>
  <path d="M18 33v6h6v-6" fill="#7F77DD"/>
  <!-- kardus kanan bawah -->
  <rect x="34" y="33" width="18" height="17" rx="2.5" fill="#CECBF6"/>
  <path d="M40 33v6h6v-6" fill="#AFA9EC"/>
  <!-- garis rak -->
  <rect x="9" y="52" width="46" height="3" rx="1.5" fill="#EF9F27"/>
</svg>
